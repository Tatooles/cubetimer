catalog:
  # Stay on the 0.1 line already locked in this repo. 0.1.24 is the patched
  # release for the Vite+ advisories that are fixed before 1.0. Current npm
  # "latest" is 1.x and is intentionally not pulled in here.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 1.7.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Same-major floors for transitive advisories. These stay inside the major
  # already present in the lockfile.
  "@babel/core": 7.29.13
  baseline-browser-mapping: 2.11.39
  brace-expansion: 5.0.13
  browserslist: 4.28.9
  fflate: 0.8.3
  nanoid: 3.3.20
  postcss: 8.5.33
  source-map-js: 1.2.4
  tinypool: 2.1.2
  ws: 8.21.0
  zod: 4.6.7
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
